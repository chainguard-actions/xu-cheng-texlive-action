name: Test docker_image input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          run: echo "Running with custom docker_image"
          docker_image: ghcr.io/xu-cheng/texlive-small:latest
      - name: Assert action completed successfully
        run: |
          echo "PASS: action ran successfully with docker_image input"
