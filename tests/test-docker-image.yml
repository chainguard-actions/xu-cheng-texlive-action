name: Test docker_image input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          docker_image: ghcr.io/xu-cheng/texlive-small:latest
          run: echo "Custom docker image is working" && tex --version
      - name: Assert action succeeded
        run: |
          echo "PASS: action with docker_image completed successfully"
