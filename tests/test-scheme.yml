name: Test scheme input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          scheme: small
          run: echo "TeXLive small scheme is available" && tex --version
      - name: Assert action succeeded
        run: |
          echo "PASS: action with scheme=small completed successfully"
