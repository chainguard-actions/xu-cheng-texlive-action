name: Test texlive_version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          texlive_version: "2024"
          run: echo "TeXLive 2024 is available" && latex --version
      - name: Assert action succeeded
        run: |
          echo "PASS: action with texlive_version=2024 completed successfully"
